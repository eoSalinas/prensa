<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>prensa: optimize EPUBs for your e-reader</title>
  <meta name="description" content="Optimize an EPUB for the Xteink X4 or X3 in your browser. Your file never leaves your device.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="site-header">
    <a class="wordmark" href="./">prensa</a>
    <p>An EPUB optimizer for the CrossPoint ecosystem</p>
  </header>

  <main>

    <div class="intro">
      <h1>Make any EPUB light enough for your e-reader</h1>
      <p>Pick a book, pick your device, download the optimized copy. Everything runs in your browser, so your file is never uploaded.</p>
    </div>

    <div class="screen">
      <section id="pick" aria-labelledby="pick-title">
        <h2 id="pick-title">Choose a book</h2>
        <div id="drop" class="drop">
          <input id="file" type="file" accept=".epub,application/epub+zip">
          <label for="file">Choose an .epub file</label>
          <span class="hint">or drop it here</span>
        </div>
        <p id="file-name" class="hint" hidden></p>
      </section>

      <form id="options" aria-labelledby="opt-title">
        <h2 id="opt-title">Choose your device</h2>
        <p class="field">
          <label for="device">Device</label>
          <select id="device" name="device">
            <option value="x4">Xteink X4</option>
            <option value="x3">Xteink X3</option>
          </select>
        </p>


        <button id="run" type="submit" disabled>Optimize book</button>
      </form>

    </div>


  </main


</body>
</html>
