name: Release

# Publishes to crates.io and creates the GitHub Release when a version tag is
# pushed. Bump the version in a `chore: release vX.Y.Z` PR first, then:
#   git tag -s vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for a manual approval (environment protection) before publishing.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for crates.io trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag is on main and matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "prensa-cli") | .version')
          [ "$GITHUB_REF_NAME" = "v$version" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - run: cargo test --workspace

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
