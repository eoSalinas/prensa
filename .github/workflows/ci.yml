name: CI

# Runs on pull requests; main is meant to change only through them.
# workflow_dispatch allows a manual run from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the repo the PR changes. Every other job is about the Rust
  # code, so a PR that only changes docs or web/ skips them. A manual run
  # (workflow_dispatch) has no PR to compare against and runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The CLI turns on prensa's `parallel` feature for the whole workspace;
      # test prensa alone too, as it builds by default (one image at a time).
      - run: cargo test -p prensa

  # The web bindings: tests run in Node, and the package the web page uses
  # must build.
  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy -p prensa-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: wasm-pack test --node crates/prensa-wasm
      - run: wasm-pack build crates/prensa-wasm --release --target web

  # Keep in sync with `rust-version` in the root Cargo.toml.
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # A PR that breaks the library API must bump the version in the same PR
  # (Rust for Rustaceans, "Unreleased Versions"). Compares against the latest
  # release on crates.io; the CLI has no Rust API and is not checked.
  semver:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: prensa

  # The one check the ruleset requires (with the PR title), so it does not
  # list each job. A skipped job passes; a failed or cancelled one does not.
  ci-ok:
    needs: [changes, check, wasm, msrv, semver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A CI job failed or was cancelled"
          exit 1
      - run: echo "CI passed"
