[package]
name = "prensa-cli"
description = "Command-line interface for prensa, the EPUB optimizer for e-ink readers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "multimedia::images"]
readme = "README.md"

[[bin]]
name = "prensa"
path = "src/main.rs"

[dependencies]
prensa = { path = "../prensa", version = "0.2.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
indicatif = "0.18.6"
console = "0.16.6"
