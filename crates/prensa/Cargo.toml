[package]
name = "prensa"
description = "Optimize EPUBs for e-ink readers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["multimedia::images"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
quick-xml = "0.42.0"
regex = "1.13.1"
thiserror = "2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
