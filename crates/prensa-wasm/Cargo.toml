[package]
name = "prensa-wasm"
description = "WebAssembly bindings for prensa, the EPUB optimizer for e-ink readers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"
# Shipped as a wasm-pack package for the web page, not as a crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
prensa = { version = "0.2.0", path = "../prensa" }
wasm-bindgen = "0.2.130"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
wasm-bindgen-test = "0.3.80"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
